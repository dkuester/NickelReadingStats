name: Release

# Publishes a release for every pushed v* tag: runs CI, checks that the tag
# sits on main, cross-builds Kobo.tgz and attaches it with SHA256SUMS. The
# release text comes from .github/release-notes/<tag>.md, which has to be
# merged to main before the tag is pushed; its first heading is the title.
# A tag with a "-" suffix (v1.0.0-rc1) becomes a pre-release.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    container: ghcr.io/dkuester/nickelstorygraph-toolchain:latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check tag and release notes
        run: |
          notes=".github/release-notes/$TAG.md"
          if [ ! -f "$notes" ]; then
            echo "::error::Missing $notes - merge the release notes to main before tagging."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $TAG is not on main."
            exit 1
          fi
          prerelease=false
          case "$TAG" in *-*) prerelease=true ;; esac
          echo "NOTES=$notes" >> "$GITHUB_ENV"
          echo "PRERELEASE=$prerelease" >> "$GITHUB_ENV"

      - name: Build Kobo.tgz
        run: |
          export VERSION="$TAG"
          make -C hook
          make -C hook kobo
          mkdir dist
          cp hook/Kobo.tgz dist/
          (cd dist && sha256sum Kobo.tgz > SHA256SUMS && cat SHA256SUMS)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The toolchain image has no gh; use the REST API.
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          auth="Authorization: Bearer $GH_TOKEN"
          payload=$(python3 -c '
          import json, os
          lines = open(os.environ["NOTES"]).read().splitlines()
          # The first heading is the title; the rest is the body.
          title, body = os.environ["TAG"], lines
          if lines and lines[0].startswith("#"):
              title, body = lines[0].lstrip("#").strip(), lines[1:]
          print(json.dumps({"tag_name": os.environ["TAG"], "name": title,
                            "body": "\n".join(body).strip() + "\n",
                            "prerelease": os.environ["PRERELEASE"] == "true"}))')
          upload=$(curl -sSf -X POST -H "$auth" -H 'Accept: application/vnd.github+json' \
            -d "$payload" "$api/releases" \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["upload_url"].split("{")[0])')
          for f in dist/*; do
            curl -sSf -X POST -H "$auth" -H 'Content-Type: application/octet-stream' \
              --data-binary "@$f" "$upload?name=$(basename "$f")" > /dev/null
            echo "attached $(basename "$f")"
          done
